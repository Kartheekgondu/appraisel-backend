spring.application.name=appraisel

# Database: configure these in Render -> Service -> Environment.
# Local defaults are only for development; never put real credentials here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/appraisel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Render supplies PORT. 8080 is the local default.
server.port=${PORT:8080}

# Comma-separated browser origins for direct API access.
# The Vercel /backend proxy is same-origin and does not rely on CORS.
FRONTEND_URL=${FRONTEND_URL:http://localhost:5173}

# SMTP credentials must be supplied as Render environment variables.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
