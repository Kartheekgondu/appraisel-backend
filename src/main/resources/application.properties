spring.application.name=appraisel

# Database configuration
# Render must provide SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# and SPRING_DATASOURCE_PASSWORD in the service Environment settings.
# The localhost fallback is only for local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/appraisel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Kartheek123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Render provides PORT automatically; use 9090 locally.
server.port=${PORT:9090}

# Email configuration (set credentials as environment variables; do not commit secrets)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:Kartheekgondu123@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:uhyukwugiggsdhaq}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
